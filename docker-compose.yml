services:
  postgres:
    image: postgres:16
    container_name: orion-postgres
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - orion

volumes:
  postgres-data:

networks:
  orion:
    external: true
